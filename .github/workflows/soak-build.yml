name: Soak Build

# On-demand only (workflow_dispatch): build a Developer ID-signed, notarized
# .zip of the current commit — an installable test artifact for soaking
# changes between releases. Deliberately NO tag, NO GitHub Release, and NO
# appcast publish: the Sparkle appcast is the only update-discovery surface,
# so a build that never enters it can never be offered to release installs.
#
# The soak build itself reads the production appcast. Its CFBundleVersion
# (commit count) is higher than the latest release's, so it reports
# "Up to date" — until the NEXT release lands with a higher count, at which
# point the soak install is offered that release and self-heals onto the
# stable train. (That arithmetic assumes the build is cut from main;
# dispatching from another branch works but the count comparison is only
# guaranteed monotonic against releases on main.)
#
# The version string is labeled — e.g. 0.2.1-soak.ab12cd3 — so About and
# Settings always identify a soak build; it can never masquerade as a
# release. Ordinary CI (push/PR) is untouched: no signing or notarization
# round-trips there.
#
# Required repository secrets (same as the release workflow):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD,
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: macos-26   # macOS 26 host required: the layered AppIcon.icon compile (ibtoold) crashes when Xcode 26 runs on a macOS 15 host
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history → monotonic build number via rev-list

      - name: Select latest stable Xcode
        # The project is in Xcode 16+ format (objectVersion 77); the runner's
        # default Xcode can be older, so pick the newest non-beta Xcode present.
        run: |
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Clear SwiftPM artifact cache
        # SwiftPM wedges on a partially-downloaded binary artifact ("... already
        # exists in file system" for Sparkle's zip, seen 2026-07-09); a stale
        # cache on the runner is never worth keeping. Start clean.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Resolve version
        id: ver
        run: |
          MARKETING="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);.*/\1/p' \
            SyncthingMenu.xcodeproj/project.pbxproj | head -1)"
          BUILD="$(git rev-list --count HEAD)"
          SHA="$(git rev-parse --short HEAD)"
          VERSION="${MARKETING}-soak.${SHA}"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "Soak build $VERSION (build $BUILD)"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so xcodebuild/codesign find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign & notarize
        id: build
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" ./Scripts/sign-and-notarize.sh
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "zip=build/SyncthingMenu-${RELEASE_VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        # The artifact downloads as GitHub's zip WRAPPER around our zip
        # (inherent to Actions artifacts; the app must be zipped first anyway
        # — upload-artifact drops permissions/symlinks, which would break the
        # bundle and its signature). The artifact name becomes the wrapper's
        # filename, so it must differ from the zip it contains: a same-named
        # zip-inside-a-zip trips Archive Utility (extraction collisions that
        # read as a corrupt file — seen on the first soak build).
        uses: actions/upload-artifact@v6   # v6 = Node 24 (v4/v5 run on Node 20, removed Sept 2026)
        with:
          name: soak-${{ steps.ver.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          retention-days: 14
          if-no-files-found: error
